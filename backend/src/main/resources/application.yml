server:
  port: 8080

spring:
  application:
    name: brd-store-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/brd_store
    username: brd_store
    password: admin@123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

app:
  jwt:
    secret: ${JWT_SECRET:brd-store-demo-super-secret-key-change-me-in-prod-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  uploads:
    dir: ${UPLOADS_DIR:uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.brdstore: INFO
