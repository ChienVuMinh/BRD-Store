services:
  postgres:
    image: postgres:16
    container_name: brd_store_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brd_store
      POSTGRES_USER: brd_store
      POSTGRES_PASSWORD: brd_store
    ports:
      - "5432:5432"
    volumes:
      - brd_store_pgdata:/var/lib/postgresql/data

volumes:
  brd_store_pgdata:
